name: V10 CI

on:
  push:
    branches: [v10-supabase-complete]
  pull_request:
    branches: [v10-supabase-complete]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile auth.py bootstrap.py main.py supabase_v9.py agent.py db.py
      - name: Validate migration text
        run: test -s migrations/001_supabase_v9.sql

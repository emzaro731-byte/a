name: V10 CI

on:
  push:
    branches: [v10-supabase-complete]
  pull_request:
    branches: [v10-supabase-complete]
  workflow_dispatch:

concurrency:
  group: v10-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTH_SECRET: ci-test-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      AI_API_KEY: ci-test-api-key
      REQUIRE_API_KEY: false
      AI_DB_PATH: ${{ github.workspace }}/.ci/ai.db
      STORAGE_ROOT: ${{ github.workspace }}/.ci/storage
      CI_STORAGE_ROOT: ${{ github.workspace }}/.ci/storage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare writable CI directories
        run: |
          mkdir -p "${{ github.workspace }}/.ci/storage"
          touch "${{ github.workspace }}/.ci/.write-test"
          rm "${{ github.workspace }}/.ci/.write-test"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all application Python modules
        run: |
          python -m py_compile \
            auth.py \
            bootstrap.py \
            main.py \
            supabase_v9.py \
            supabase_compat.py \
            agent.py \
            db.py \
            gateway.py \
            ai_intelligence.py \
            production.py \
            media.py

      - name: Validate migration
        run: test -s migrations/001_supabase_v9.sql

      - name: Import application modules
        run: |
          echo "AI_DB_PATH=$AI_DB_PATH"
          echo "STORAGE_ROOT=$STORAGE_ROOT"
          python -c "import auth, db, ai_intelligence, production, agent, gateway, main, bootstrap, supabase_v9, supabase_compat; print('Python imports OK')"

name: Fast CI

on:
  push:
    branches:
      - v10-supabase-complete
  pull_request:
    branches:
      - v10-supabase-complete
  workflow_dispatch:

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-check:
    name: Python syntax and imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m py_compile \
            auth.py \
            bootstrap.py \
            main.py \
            supabase_v9.py \
            supabase_compat.py \
            agent.py \
            gateway.py \
            ai_intelligence.py \
            production.py \
            db.py

      - name: Import application modules
        env:
          AUTH_SECRET: ci-test-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          AI_API_KEY: ci-test-api-key
          REQUIRE_API_KEY: 'false'
        run: python -c "import auth, db, ai_intelligence, production, agent, gateway, main, bootstrap, supabase_v9; print('Python imports OK')"

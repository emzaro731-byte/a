services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    gpus: all

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      AI_MODEL: ${AI_MODEL:-qwen2.5:3b}
      AI_FAST_MODEL: ${AI_FAST_MODEL:-qwen2.5:3b}
      AI_REASONING_MODEL: ${AI_REASONING_MODEL:-qwen2.5:3b}
      AI_CODING_MODEL: ${AI_CODING_MODEL:-qwen2.5:3b}
      AI_API_KEY: ${AI_API_KEY:-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      AI_SYSTEM_PROMPT: ${AI_SYSTEM_PROMPT:-You are a helpful AI assistant.}
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  model-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      AI_MODEL: ${AI_MODEL:-qwen2.5:3b}
      AI_FAST_MODEL: ${AI_FAST_MODEL:-qwen2.5:3b}
      AI_REASONING_MODEL: ${AI_REASONING_MODEL:-qwen2.5:3b}
      AI_CODING_MODEL: ${AI_CODING_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      'until ollama list >/dev/null 2>&1; do sleep 2; done;
      for model in "$$AI_MODEL" "$$AI_FAST_MODEL" "$$AI_REASONING_MODEL" "$$AI_CODING_MODEL";
      do [ -n "$$model" ] && ollama pull "$$model"; done'
    restart: "no"

volumes:
  ollama:

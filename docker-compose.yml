services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    gpus: all

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - ollama
      - media
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      IMAGE_GENERATOR_URL: http://media:8100/v1/images/generations
      VIDEO_GENERATOR_URL: http://media:8100/v1/videos/generations
      MUSIC_GENERATOR_URL: http://media:8100/v1/audio/music/generations
      AI_MODEL: ${AI_MODEL:-qwen2.5:3b}
      AI_FAST_MODEL: ${AI_FAST_MODEL:-qwen2.5:3b}
      AI_REASONING_MODEL: ${AI_REASONING_MODEL:-qwen2.5:3b}
      AI_CODING_MODEL: ${AI_CODING_MODEL:-qwen2.5:3b}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-qwen2.5:3b}
      AI_API_KEY: ${AI_API_KEY:?Set AI_API_KEY in .env before starting}
      REQUIRE_API_KEY: ${REQUIRE_API_KEY:-true}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET to a random 32+ character secret in .env}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-604800}
      DAILY_REQUEST_LIMIT: ${DAILY_REQUEST_LIMIT:-1000}
      STORAGE_ROOT: /data/storage
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      MAX_CONTEXT_MESSAGES: ${MAX_CONTEXT_MESSAGES:-40}
      AI_DB_PATH: /data/ai.db
      AI_SYSTEM_PROMPT: ${AI_SYSTEM_PROMPT:-You are a helpful, accurate, capable AI assistant.}
    volumes:
      - ai_data:/data
    command: uvicorn bootstrap:app --host 0.0.0.0 --port 8000

  media:
    build: ./media-server
    restart: unless-stopped
    expose:
      - "8100"
    gpus: all
    environment:
      HF_HOME: /models
      TRANSFORMERS_CACHE: /models
      MEDIA_OUTPUT_DIR: /outputs
      IMAGE_MODEL: ${IMAGE_MODEL:-stabilityai/stable-diffusion-xl-base-1.0}
      VIDEO_MODEL: ${VIDEO_MODEL:-THUDM/CogVideoX-2b}
      MUSIC_MODEL: ${MUSIC_MODEL:-facebook/musicgen-small}
    volumes:
      - hf_models:/models
      - media_outputs:/outputs

  model-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      AI_MODEL: ${AI_MODEL:-qwen2.5:3b}
      AI_FAST_MODEL: ${AI_FAST_MODEL:-qwen2.5:3b}
      AI_REASONING_MODEL: ${AI_REASONING_MODEL:-qwen2.5:3b}
      AI_CODING_MODEL: ${AI_CODING_MODEL:-qwen2.5:3b}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      'until ollama list >/dev/null 2>&1; do sleep 2; done;
      for model in "$$AI_MODEL" "$$AI_FAST_MODEL" "$$AI_REASONING_MODEL" "$$AI_CODING_MODEL" "$$AI_VISION_MODEL";
      do [ -n "$$model" ] && ollama pull "$$model"; done'
    restart: "no"

volumes:
  ollama:
  ai_data:
  hf_models:
  media_outputs:
